# Installed by the PtcManager deployment as
# /etc/systemd/system/ptc_manager.service.d/50-ptc-manager-resources.conf.
#
# The console shares a four-core host with the agents' build, test and verify
# runs inside ptc_manager-herdr.service. Without priority its process is
# starved and swapped out under their load, and a SQLite write lock it holds
# then stays held for seconds, which every other writer reports as
# "database is locked".
[Service]
CPUWeight=1000
IOWeight=1000
MemoryLow=512M
