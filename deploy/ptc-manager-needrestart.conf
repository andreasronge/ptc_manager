# Installed by the PtcManager deployment as /etc/needrestart/conf.d/ptc-manager.conf.
#
# needrestart runs after unattended upgrades and restarts every service linked
# against an upgraded library. Restarting ptc_manager-herdr ends every retained
# agent session and a restarted console re-reads a Herdr that reports each
# restored pane as idle, so both units are left to the deployment, which
# restarts them only when nothing is retained.
$nrconf{override_rc}{qr(^ptc_manager\.service$)} = 0;
$nrconf{override_rc}{qr(^ptc_manager-herdr\.service$)} = 0;
