name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/js/*.mjs
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29-elixir-1.20-${{ hashFiles('mix.lock') }}
      - run: ./scripts/ptc/bootstrap
      - run: ./scripts/ci/pre-publication
        env:
          PTC_TEST_PARTITION_ONLY: ${{ matrix.partition }}
          PTC_TEST_PARTITIONS: 5
          ERL_FLAGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
      - run: git diff --exit-code

  # macOS agent hosts run the operation wrapper with the stock /usr/bin/python3
  # and without cgroups, so its contracts and end-to-end tests run there too.
  macos-host:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install elixir coreutils
      - run: echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-brew-elixir-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: /usr/bin/python3 test/review_worker_contract.py
      - run: /usr/bin/python3 test/delivery_metrics_contract.py
      - run: mix test --include resource_e2e test/ptc_manager/resource_operation_broker_test.exs test/ptc_manager/resource_operation_wrapper_e2e_test.exs test/ptc_manager/resource_operations_test.exs test/ptc_manager/macos_runtime_test.exs
