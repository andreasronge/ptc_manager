name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29-elixir-1.20-${{ hashFiles('mix.lock') }}
      - run: ./scripts/ptc/bootstrap
      - run: ./scripts/ci/pre-publication
        env:
          PTC_TEST_PARTITION_ONLY: ${{ matrix.partition }}
          ERL_FLAGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none"
      - run: git diff --exit-code
