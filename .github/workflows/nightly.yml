name: Nightly system tests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-system-tests
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29-elixir-1.20-${{ hashFiles('mix.lock') }}
      - run: ./scripts/ptc/bootstrap
      - name: Run the complete suite, including nightly system tests
        run: mix test
      - run: ./scripts/duplication_gate.sh check
      - run: git diff --exit-code
